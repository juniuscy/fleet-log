<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E4C66">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fleet Log">
<title>Trolley Repair Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root{
    --ink:#101828; --body:#344054; --muted:#667085; --faint:#98A2B3;
    --line:#E4E7EC; --line-soft:#F0F2F5; --bg:#F5F7FA; --surface:#FFFFFF;
    --brand:#0E4C66; --brand-dark:#0A3A4E; --brand-tint:#EEF5F8;
    --ok:#067647; --ok-bg:#ECFDF3; --ok-line:#ABEFC6;
    --down:#B42318; --down-bg:#FEF3F2; --down-line:#FECDCA;
    --warn:#B54708; --warn-bg:#FFFAEB; --warn-line:#FEDF89;
    --info:#175CD3; --info-bg:#EFF8FF; --info-line:#B2DDFF;
    --head:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;
    --text:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
    --mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
    --r:10px; --r-sm:6px;
    --sh:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.05);
    --sh-lg:0 12px 32px rgba(16,24,40,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--body);font-family:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--head);color:var(--ink);margin:0}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}

  /* ---------- top bar ---------- */
  .topbar{background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1200px;margin:0 auto;padding:16px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .brandmark{display:flex;gap:12px;align-items:center}
  .glyph{width:38px;height:38px;border-radius:9px;background:var(--brand);display:grid;place-items:center;flex:none}
  .glyph svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .brandmark h1{font-size:18px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
  .brandmark p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
  .topbar-right{display:flex;gap:12px;align-items:center}
  .saveflag{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .saveflag i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
  .saveflag.warn i{background:var(--warn)}

  /* ---------- tabs ---------- */
  .tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .tabs-in{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
  .tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;font-family:var(--text);font-weight:500;font-size:14.5px;
       color:var(--muted);padding:13px 14px 11px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--ink)}
  .tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
  .badge{font-family:var(--mono);font-size:11px;background:var(--line-soft);color:var(--muted);border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
  .tab[aria-selected="true"] .badge{background:var(--brand-tint);color:var(--brand)}

  main{max-width:1200px;margin:0 auto;padding:24px 20px 90px}

  /* ---------- primitives ---------- */
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:0 0 16px}
  .sec-head h2{font-size:20px;font-weight:700;letter-spacing:-.015em}
  .sub{color:var(--muted);font-size:13.5px;margin:2px 0 0}
  .unithead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .linkbtn{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--brand);cursor:pointer;text-align:left}
  .linkbtn:hover{text-decoration:underline}
  .linkbtn .jobref{color:var(--muted)}
  .grouphead{display:flex;align-items:center;gap:12px;margin:26px 0 12px}
  .grouphead:first-of-type{margin-top:4px}
  .grouphead.sm{margin:20px 0 10px}
  .hero .grouphead.sm:first-of-type{margin-top:4px}
  .sizebadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink);
    border:1px solid var(--line);background:var(--line-soft);border-radius:6px;padding:4px 9px;white-space:nowrap;margin-left:auto}
  .sizebadge i{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none;border:1px solid rgba(16,24,40,.12)}
  .hint{color:var(--muted);font-size:13.5px;margin:0}

  .btn{appearance:none;font-family:var(--text);font-weight:600;font-size:14px;border:1px solid var(--brand);background:var(--brand);color:#fff;
       padding:9px 16px;border-radius:var(--r-sm);cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s;line-height:1.4}
  .btn:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
  .btn.ghost{background:var(--surface);color:var(--body);border-color:var(--line)}
  .btn.ghost:hover{background:var(--bg);border-color:#CDD3DB;color:var(--ink)}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn.danger{background:var(--surface);color:var(--down);border-color:var(--down-line)}
  .btn.danger:hover{background:var(--down-bg);border-color:var(--down)}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}

  input,select,textarea{font-family:var(--text);font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid #D0D5DD;
    border-radius:var(--r-sm);padding:10px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
  textarea{resize:vertical;min-height:96px}
  input:hover,select:hover,textarea:hover{border-color:#B9C0CB}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,76,102,.12)}
  label.f{display:block;margin-bottom:16px}
  label.f > span.lbl{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
  label.f > span.lbl em{font-style:normal;color:var(--down);margin-left:2px}
  label.f small{display:block;color:var(--muted);font-size:12.5px;margin-top:5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
  .money{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .jobref{font-family:var(--mono);font-size:11.5px;color:var(--muted)}

  /* pills */
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:20px;
        border:1px solid var(--line);background:var(--line-soft);color:var(--muted);white-space:nowrap}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
  .pill[data-s="Quoted"]{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
  .pill[data-s="In progress"]{background:var(--info-bg);border-color:var(--info-line);color:var(--info)}
  .pill[data-s="Completed"]{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .pill.down{background:var(--down-bg);border-color:var(--down-line);color:var(--down)}
  .pill.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .pill.urgent{background:var(--down-bg);border-color:var(--down-line);color:var(--down)}

  /* ---------- fleet strip (board hero) ---------- */
  .hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:22px 24px;margin-bottom:16px}
  .hero-top{display:flex;gap:24px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
  .readout .big{font-family:var(--head);font-weight:800;font-size:44px;letter-spacing:-.03em;line-height:1;color:var(--ink)}
  .readout .big span{color:var(--faint);font-weight:700}
  .readout .cap{font-size:13.5px;color:var(--muted);margin-top:6px}
  .legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .legend div{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
  .legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
  .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:7px}
  .chip{border:1px solid var(--ok-line);background:var(--ok-bg);color:var(--ok);border-radius:var(--r-sm);padding:9px 4px;text-align:center;
        font-family:var(--mono);font-size:12.5px;font-weight:500;cursor:pointer;transition:transform .1s,box-shadow .15s}
  .chip:hover{transform:translateY(-1px);box-shadow:var(--sh)}
  .chip[data-st="repair"]{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
  .chip[data-st="down"]{background:#F2F4F7;border-color:#E4E7EC;color:var(--faint);text-decoration:line-through}
  .chip[data-st="retired"]{background:transparent;border-style:dashed;border-color:var(--line);color:var(--faint)}
  .legend.sizes{margin-top:15px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .legend i.ul{width:18px;height:4px;border-radius:2px}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px}
  .stat .k{font-size:13px;color:var(--muted);font-weight:500}
  .stat .v{font-family:var(--head);font-weight:800;font-size:30px;letter-spacing:-.025em;color:var(--ink);margin-top:8px;line-height:1}
  .stat .note{font-size:12.5px;margin-top:8px;color:var(--muted)}
  .stat .note.alert{color:var(--warn);font-weight:500}
  button.stat{font-family:var(--text);text-align:left;width:100%;cursor:pointer;transition:border-color .15s,box-shadow .15s}
  button.stat:hover{border-color:var(--brand);box-shadow:0 2px 8px rgba(14,76,102,.12)}
  .stat .k{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .stat .go{color:var(--brand);font-weight:600;font-size:12.5px;opacity:0;transition:opacity .15s}
  button.stat:hover .go{opacity:1}
  @media (hover:none){ .stat .go{opacity:1} }

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
  .panel h3{font-size:15px;font-weight:700;padding:16px 20px;border-bottom:1px solid var(--line-soft)}
  .panel .pbody{padding:16px 20px}
  .feed{list-style:none;margin:0;padding:0}
  .feed li{padding:11px 0;border-bottom:1px solid var(--line-soft);display:flex;gap:12px;align-items:flex-start;font-size:13.5px}
  .feed li:last-child{border-bottom:0;padding-bottom:0}
  .feed b{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:500;flex:none;width:52px}
  .bar-row{margin-bottom:14px}
  .bar-row:last-child{margin-bottom:0}
  .bar-row .lbl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;gap:10px;color:var(--ink)}
  .bar{height:8px;background:var(--line-soft);border-radius:20px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:20px}

  /* ---------- repairs ---------- */
  .toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:18px}
  .jobs{display:grid;gap:14px}
  .job{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
  .job-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:18px 20px 0}
  .job-unit{display:flex;gap:14px;align-items:center;min-width:0}
  .plate{width:64px;height:64px;border-radius:var(--r-sm);background:var(--brand-tint);border:1px solid #D3E3EA;color:var(--brand);
         display:grid;place-content:center;text-align:center;flex:none}
  .plate b{font-family:var(--head);font-weight:800;font-size:17px;letter-spacing:-.02em;line-height:1.1}
  .plate span{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
  .job.down .plate{background:#F2F4F7;border-color:var(--line);color:var(--faint)}
  .job-unit h4{font-size:16px;font-weight:700;letter-spacing:-.01em}
  .job-unit .meta{font-size:13px;color:var(--muted);margin-top:3px}
  .job-fault{padding:14px 20px 0;font-size:14.5px;color:var(--body);white-space:pre-wrap}
  .job-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px;padding:14px 20px;
            border-top:1px solid var(--line-soft);background:#FCFCFD}
  .amount{text-align:right}
  .amount .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .amount .v{font-family:var(--mono);font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
  .rcpt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ok);background:var(--ok-bg);border:1px solid var(--ok-line);
        border-radius:20px;padding:4px 11px}
  .rcpt.none{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
  .rcpt.plain{color:var(--muted);background:var(--line-soft);border-color:var(--line)}
  .job-actions{display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin-left:auto}
  .job-actions .row{justify-content:flex-end;gap:8px}
  @media (max-width:560px){ .job-actions{align-items:stretch;width:100%;margin-left:0} .job-actions .row{justify-content:flex-start} }

  /* ---------- fleet grid ---------- */
  .fleet{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .unit{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 17px}
  .unit h4{font-family:var(--head);font-weight:800;font-size:20px;letter-spacing:-.02em}
  .unit .nt{font-size:12.5px;color:var(--muted);margin-top:10px;min-height:18px}
  .unit .acts{margin-top:14px;display:flex;gap:8px}
  .unit[data-st="down"]{background:#F9FAFB}
  .unit[data-st="down"] h4{color:var(--faint)}
  .unit[data-st="retired"]{background:#F9FAFB;border-style:dashed}
  .unit[data-st="retired"] h4{color:var(--faint)}

  /* ---------- tables ---------- */
  .tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FCFCFD}
  td{padding:14px 16px;border-bottom:1px solid var(--line-soft);vertical-align:middle;color:var(--body)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:#FCFCFD}
  td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
  tfoot td{background:#FCFCFD;font-weight:600;color:var(--ink);border-top:1px solid var(--line)}

  /* ---------- vendors ---------- */
  .vendors{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  .vendor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
  .vendor.off{background:#F9FAFB}
  .vendor h4{font-size:16.5px;font-weight:700}
  .trade{font-size:12.5px;color:var(--brand);font-weight:500;margin-top:2px}
  .vlines{margin-top:14px;display:grid;gap:7px;font-size:13.5px}
  .vlines div{display:flex;gap:10px}
  .vlines span{font-size:12.5px;color:var(--muted);min-width:74px;flex:none}
  .vstats{display:flex;gap:28px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .vstats div{font-size:12.5px;color:var(--muted)}
  .vstats b{display:block;font-family:var(--head);font-size:19px;color:var(--ink);margin-top:2px}

  /* ---------- empty ---------- */
  .empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:56px 24px;text-align:center;box-shadow:var(--sh)}
  .empty .glyph{margin:0 auto 16px;width:46px;height:46px;background:var(--brand-tint)}
  .empty .glyph svg{stroke:var(--brand);width:24px;height:24px}
  .empty h3{font-size:17px;font-weight:700;margin-bottom:6px}
  .empty p{color:var(--muted);margin:0 auto 20px;max-width:44ch;font-size:14px}

  /* ---------- modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(16,24,40,.5);backdrop-filter:blur(2px);display:none;z-index:60;padding:20px;overflow-y:auto}
  .scrim.open{display:block}
  .modal{background:var(--surface);max-width:640px;margin:28px auto;border-radius:14px;box-shadow:var(--sh-lg);animation:rise .18s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
  .modal-head h3{font-size:18px;font-weight:700;letter-spacing:-.015em}
  .modal-head p{margin:3px 0 0;font-size:13px;color:var(--muted)}
  .x{appearance:none;background:none;border:0;font-size:26px;line-height:1;color:var(--faint);cursor:pointer;padding:0 4px}
  .x:hover{color:var(--ink)}
  .modal-body{padding:22px 24px}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:#FCFCFD;
              border-radius:0 0 14px 14px;flex-wrap:wrap}
  .fieldset{border:0;padding:0;margin:22px 0 0}
  .fieldset legend{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0;margin-bottom:14px;
    width:100%;border-top:1px solid var(--line);padding-top:18px}

  /* choice cards */
  .choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .opt{border:1px solid #D0D5DD;border-radius:var(--r-sm);padding:13px 14px;cursor:pointer;display:flex;gap:11px;align-items:flex-start;
       background:var(--surface);transition:border-color .15s,background .15s,box-shadow .15s}
  .opt:hover{border-color:var(--brand);background:#FCFEFF}
  .opt input{width:17px;height:17px;margin:2px 0 0;flex:none;accent-color:var(--brand)}
  .opt b{display:block;font-size:14px;color:var(--ink);font-weight:600}
  .opt small{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
  .opt:has(input:checked){border-color:var(--brand);background:var(--brand-tint);box-shadow:0 0 0 3px rgba(14,76,102,.1)}
  .opt.warn:has(input:checked){border-color:var(--down);background:var(--down-bg);box-shadow:0 0 0 3px rgba(180,35,24,.1)}
  .opt.warn:has(input:checked) b{color:var(--down)}
  .opt.warn input{accent-color:var(--down)}

  .total-strip{background:var(--brand);color:#fff;border-radius:var(--r-sm);padding:14px 16px;display:flex;justify-content:space-between;
    align-items:center;margin-bottom:20px}
  .total-strip span{font-size:12.5px;color:#B8D4DE}
  .total-strip b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums;font-weight:500}

  /* capture area */
  .drop{border:1px dashed #CDD5DF;border-radius:var(--r-sm);padding:24px 18px;text-align:center;background:#FCFCFD}
  .drop img{max-width:100%;max-height:250px;border:1px solid var(--line);border-radius:var(--r-sm);display:block;margin:0 auto 14px}
  .drop .fname{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:14px;word-break:break-all}
  .drop p{margin:0 0 16px;font-size:13.5px;color:var(--muted)}
  .drop .row{justify-content:center}

  .unitlink{appearance:none;background:none;border:0;padding:0;cursor:pointer;font-family:var(--head);font-weight:800;
    font-size:20px;letter-spacing:-.02em;color:var(--ink);text-align:left}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;
    border-radius:var(--r-sm);font-size:13.5px;box-shadow:var(--sh-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:90vw}

<script src="store.js"></script>
<script>
const KEY = 'trolley-repair-log';
const GST_DEFAULT = 0.09;
const gstRate = () => (typeof state.gstRate==='number' && state.gstRate>=0) ? state.gstRate : GST_DEFAULT;
const gstPct  = () => +(gstRate()*100).toFixed(2);
const STATUSES   = ['Submitted','Quoted','In progress','Completed','Cancelled'];
const PRIORITIES = ['Low','Normal','Urgent'];
const OPEN = ['Submitted','Quoted','In progress'];
const photoKey = jid => 'trolley-receipt-file-' + jid;
let pendingFile, shownPhoto = null;

/* Everything is stored in Google: records in the Sheet, receipt pictures in Drive (see store.js). */
const DB = Store.open('Trolley');

let state = { jobs:[], vendors:[], trolleys:[], sizes:[], seq:{job:0,vendor:0} };
let view = 'board', canSave = true;
let filters = { q:'', status:'', vendor:'', trolley:'' };

/* ---------- storage ---------- */
async function loadData(){
  canSave = true;
  const saved = await DB.load();          // throws if Google cannot be reached, so nothing gets overwritten
  if(saved) state = Object.assign({jobs:[],vendors:[],trolleys:[],sizes:[],seq:{job:0,vendor:0}}, saved);

  if(!state.trolleys || !state.trolleys.length) seedFleet();
  if(!state.sizes || !state.sizes.length){
    state.sizes = [ {name:'8 Layer', color:'#175CD3'}, {name:'6 Layer', color:'#EA580C'} ];
  }
  if(!state.sizesAssignedV2){
    state.sizesAssignedV2 = true;
    // Orange / 6 Layer: TR-01 to TR-12 and TR-19 to TR-21.  Blue / 8 Layer: the rest of TR-01..TR-23.
    state.trolleys.forEach(t=>{
      if(!/^TR-\d+$/i.test(t.id||'')) return;
      const n = parseInt(String(t.id).replace(/\D/g,''),10);
      if(isNaN(n) || n<1 || n>23) return;                 // leave anything you add later alone
      const size = ((n>=1 && n<=12) || (n>=19 && n<=21)) ? '6 Layer' : '8 Layer';
      if(!state.sizes.some(s=>s.name===size)) return;     // skip if the size was renamed
      t.size  = size;
      t.color = sizeColor(size);
    });
  }
  state.jobs.forEach(j=>{ if(!j.usable) j.usable='yes'; });
  if(!state.seededVendors){
    state.seededVendors = true;
    if(!state.vendors.some(v=>String(v.name||'').toUpperCase().includes('WAH CHYE'))){
      state.vendors.push({ id:nextId('vendor','VEN'), name:'WAH CHYE ENGINEERING WORK', trade:'Engineering work',
        contact:'', phone:'', email:'', address:'', uen:'23968100B', gstNo:'M90362230G', notes:'', active:true });
    }
  }
}
function seedFleet(){
  state.trolleys = [];
  for(let i=1;i<=23;i++) state.trolleys.push({ id:'TR-'+String(i).padStart(2,'0'), notes:'', active:true });
}
let saveTimer=null, booted=false, retryTimer=null;
function save(){
  if(!booted) return;                       // never write before the real data has loaded
  flag('Saving','warn'); clearTimeout(saveTimer); clearTimeout(retryTimer);
  saveTimer = setTimeout(async ()=>{
    saveTimer = null;
    try{ await DB.save(state); canSave = true; flagIdle(); }
    catch(err){ canSave = false; flagIdle(); storeError(err); }
  },400);
}
function storeError(err){
  const code = err && err.code;
  if(code==='conflict'){
    toast('Someone else saved changes at the same time. Loading the latest copy…');
    setTimeout(()=>location.reload(),2000); return;
  }
  if(code==='setup' || code==='passcode'){
    toast((err.message||'')+' Taking you to the login page…');
    setTimeout(()=>{ location.href='index.html#setup'; },2000); return;
  }
  toast('Not saved yet: '+((err&&err.message)||'unknown error')+' Retrying in 15 seconds.');
  retryTimer = setTimeout(save,15000);
}
function flag(text,cls){
  const el=document.getElementById('saveflag');
  el.className='saveflag'+(cls?' '+cls:''); el.querySelector('span').textContent=text;
}
function flagIdle(){
  if(!booted) return;
  if(saveTimer || DB.busy()){ flag('Saving','warn'); return; }
  if(!canSave){ flag('Not saved yet','warn'); return; }
  flag('Saved to Google');
}
window.addEventListener('beforeunload', e=>{
  if(booted && (saveTimer || DB.busy())){ e.preventDefault(); e.returnValue=''; }
});

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = ()=> new Date().toISOString().slice(0,10);
const money = n => (Number(n)||0).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
const sgd = n => '$'+money(n);
function fdate(d){
  if(!d) return '—';
  const p=String(d).split('-'); if(p.length!==3) return d;
  const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return p[2]+' '+m[+p[1]-1]+' '+p[0];
}
function ftime(iso){
  if(!iso) return '';
  const d=new Date(iso); if(isNaN(d.getTime())) return '';
  let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0');
  const ap = h>=12?'pm':'am'; h = h%12 || 12;
  return h+':'+m+ap;
}
function nextId(kind,prefix){ state.seq[kind]=(state.seq[kind]||0)+1; return prefix+'-'+String(state.seq[kind]).padStart(4,'0'); }
const vendorById = id => state.vendors.find(v=>v.id===id);
const vendorName = id => { const v=vendorById(id); return v?v.name:''; };
const jobTotal = j => (j.receipt && j.receipt.total) ? Number(j.receipt.total)||0 : Number(j.quote)||0;
const openJobs = ()=> state.jobs.filter(j=>OPEN.includes(j.status));
const downSet  = ()=> new Set(openJobs().filter(j=>j.usable==='no').map(j=>j.trolleyId));
function unitStatus(t, down){
  if(!t.active) return 'retired';
  if((down||downSet()).has(t.id)) return 'down';
  return openJobs().some(j=>j.trolleyId===t.id) ? 'repair' : 'ok';
}
const ST_LABEL = { ok:'Ready to use', repair:'Under repair, still usable', down:'Not usable', retired:'Retired' };
function sizeGroups(list){
  const known = state.sizes.map(s=>s.name);
  const groups = state.sizes.slice()
    .sort((a,b)=>String(b.color||'').toLowerCase().localeCompare(String(a.color||'').toLowerCase()))
    .map(s=>({ label:s.name, color:s.color, items:list.filter(t=>t.size===s.name) }))
    .filter(g=>g.items.length);
  const spare = list.filter(t=>!t.size || known.indexOf(t.size)<0);
  if(spare.length) groups.push({ label:'No size set', color:'#D0D5DD', items:spare });
  return groups;
}
function groupHead(g,first){
  const tint = /^#[0-9a-fA-F]{6}$/.test(g.color||'') ? g.color : '#98A2B3';
  return '<div class="grouphead"'+(first?' style="margin-top:18px"':'')+'>' +
    '<span class="sizebadge" style="border-color:'+esc(tint)+'80;background:'+esc(tint)+'14;margin-left:0">' +
      '<i style="background:'+esc(tint)+'"></i>'+esc(g.label)+'</span>' +
    '<span class="hint">'+g.items.length+' trolley'+(g.items.length===1?'':'s')+'</span></div>';
}
function sizeColor(name){ const s=state.sizes.find(x=>x.name===name); return s?s.color:''; }
function trolleyColor(t){ return (t && (t.color || sizeColor(t.size))) || ''; }
const trolleyById = id => state.trolleys.find(t=>t.id===id);
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),3400); }
function opt(list,sel){ return list.map(v=>'<option value="'+esc(v)+'"'+(v===sel?' selected':'')+'>'+esc(v)+'</option>').join(''); }
const ICON = {
  trolley:'<path d="M3 4h3l2.6 10.2a1.5 1.5 0 0 0 1.5 1.1h7.4a1.5 1.5 0 0 0 1.5-1.1L21 8H7"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/>',
  camera:'<path d="M4 8h3l1.6-2h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>'
};
const glyph = n => '<div class="glyph"><svg viewBox="0 0 24 24">'+ICON[n]+'</svg></div>';

/* ============================================================ render */
function render(){
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view===view)));
  $('#c-jobs').textContent     = openJobs().length;
  $('#c-history').textContent  = state.jobs.filter(j=>!OPEN.includes(j.status)).length;
  $('#c-fleet').textContent    = state.trolleys.filter(t=>t.active).length;
  $('#c-vendors').textContent  = state.vendors.filter(v=>v.active).length;
  $('#c-receipts').textContent = state.jobs.filter(j=>j.receipt).length;
  $('#view').innerHTML = view==='board' ? boardView()
    : view==='jobs' ? jobsView()
    : view==='history' ? historyView()
    : view==='summary' ? summaryView()
    : view==='fleet' ? fleetView()
    : view==='vendors' ? vendorsView()
    : receiptsView();
  flagIdle();
}

function sizeGroups(){
  const sorted=[...state.trolleys].sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
  const known=state.sizes.map(s=>s.name);
  const groups=state.sizes
    .map(s=>({ label:s.name, color:s.color, items:sorted.filter(t=>t.size===s.name) }))
    .filter(g=>g.items.length)
    .sort((a,b)=> b.items.length-a.items.length
      || String(a.color||'').toLowerCase().localeCompare(String(b.color||'').toLowerCase()));
  const spare=sorted.filter(t=>!t.size || known.indexOf(t.size)<0);
  if(spare.length) groups.push({ label:'No size set', color:'#D0D5DD', items:spare });
  return groups;
}
function sizeBadge(label,color,flush){
  const tint = /^#[0-9a-fA-F]{6}$/.test(color||'') ? color : '#98A2B3';
  return '<span class="sizebadge" style="border-color:'+esc(tint)+'80;background:'+esc(tint)+'14'+(flush?';margin-left:0':'')+'">' +
    '<i style="background:'+esc(tint)+'"></i>'+esc(label)+'</span>';
}
function groupHead(g,cls){
  return '<div class="grouphead'+(cls?' '+cls:'')+'">'+sizeBadge(g.label,g.color,true) +
    '<span class="hint">'+g.items.length+' trolley'+(g.items.length===1?'':'s')+'</span></div>';
}

/* ---------- overview ---------- */
function boardView(){
  const down = downSet();
  const active = state.trolleys.filter(t=>t.active);
  const usable = active.filter(t=>!down.has(t.id)).length;
  const open = openJobs();
  const urgent = open.filter(j=>j.priority==='Urgent').length;
  const awaiting = state.jobs.filter(j=>j.status==='Completed' && !j.receipt).length;
  const year = String(new Date().getFullYear());
  const spend = state.jobs.filter(j=>j.receipt && String(j.receipt.date||'').startsWith(year))
                          .reduce((s,j)=>s+(Number(j.receipt.total)||0),0);

  const byVendor={};
  state.jobs.filter(j=>j.receipt && j.vendorId).forEach(j=>{ byVendor[j.vendorId]=(byVendor[j.vendorId]||0)+(Number(j.receipt.total)||0); });
  const ranked=Object.entries(byVendor).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const max = ranked.length?ranked[0][1]:1;

  const strips = sizeGroups().map(g=>
    groupHead(g,'sm') + '<div class="strip">' + g.items.map(t=>{
      const st=unitStatus(t,down), col=trolleyColor(t)||'#D0D5DD';
      return '<button class="chip" data-st="'+st+'" data-act="trolley-log" data-id="'+esc(t.id)+'"' +
        ' style="border-bottom:3px solid '+esc(col)+'"' +
        ' title="'+esc(t.id+(t.size?' — '+t.size:'')+' — '+ST_LABEL[st])+'">'+esc(t.id)+'</button>';
    }).join('') + '</div>').join('');

  const hero =
  '<section class="hero"><div class="hero-top">' +
    '<div class="readout"><div class="big">'+usable+' <span>/ '+active.length+'</span></div>' +
    '<div class="cap">trolleys ready to use'+(down.size?' &middot; '+down.size+' out of service':'')+'</div></div>' +
    '<div class="legend">' +
      '<div><i style="background:var(--ok-bg);border:1px solid var(--ok-line)"></i>Ready</div>' +
      '<div><i style="background:var(--warn-bg);border:1px solid var(--warn-line)"></i>Under repair, usable</div>' +
      '<div><i style="background:#F2F4F7;border:1px solid var(--line)"></i>Not usable</div>' +
      '<div><i style="border:1px dashed var(--line)"></i>Retired</div>' +
    '</div></div>' + strips +
  '</section>';

  const stats = '<div class="stats">' +
    stat('Open repairs', open.length, urgent?urgent+' marked urgent':'nothing urgent', urgent>0, 'go-jobs') +
    stat('Receipts outstanding', awaiting, awaiting?'completed but not filed':'all filed', awaiting>0, 'go-outstanding') +
    stat('Spend in '+year, sgd(spend), state.jobs.filter(j=>j.receipt).length+' receipts on file', false, 'go-summary') +
  '</div>';

  const recent = [...state.jobs].sort((a,b)=>String(b.updated||'').localeCompare(String(a.updated||''))).slice(0,6);
  const panels = '<div class="panels">' +
    '<section class="panel"><h3>Recent activity</h3><div class="pbody">' +
      (recent.length
        ? '<ul class="feed">'+recent.map(j=>'<li><b>'+esc(j.trolleyId)+'</b><span>'+esc(String(j.fault||'').split('\n')[0]).slice(0,64) +
            '<br><span class="jobref">'+esc(j.status)+(j.vendorId?' &middot; '+esc(vendorName(j.vendorId)):' &middot; no vendor yet')+'</span></span></li>').join('')+'</ul>'
        : '<p class="hint">Nothing logged yet. Use the button below to raise the first one.</p>') +
    '</div></section>' +
    '<section class="panel"><h3>Spend by vendor</h3><div class="pbody">' +
      (ranked.length
        ? ranked.map(([id,amt])=>'<div class="bar-row"><div class="lbl"><span>'+esc(vendorName(id)||'Unknown')+'</span><span class="money">'+sgd(amt)+'</span></div>' +
            '<div class="bar"><i style="width:'+Math.max(4,(amt/max)*100)+'%"></i></div></div>').join('')
        : '<p class="hint">Once you file receipts, spend per vendor shows up here.</p>') +
    '</div></section></div>';

  return hero + stats + panels;
}
function stat(k,v,note,alert,act){
  const open = act ? '<button class="stat link" data-act="'+esc(act)+'">' : '<div class="stat">';
  const close = act ? '</button>' : '</div>';
  return open + '<div class="k">'+esc(k)+(act?'<span class="go">View &rsaquo;</span>':'')+'</div>' +
    '<div class="v'+(String(v).includes('$')?' money':'')+'">'+esc(v)+'</div>' +
    '<div class="note'+(alert?' alert':'')+'">'+esc(note)+'</div>' + close;
}

/* ---------- repairs ---------- */
let hFilter = { q:'', trolley:'', noReceipt:false };

function filteredJobs(){
  return state.jobs.filter(j=>{
    if(!OPEN.includes(j.status)) return false;
    if(filters.status && j.status!==filters.status) return false;
    if(filters.vendor && j.vendorId!==filters.vendor) return false;
    if(filters.trolley && j.trolleyId!==filters.trolley) return false;
    if(filters.q){
      const hay=[j.id,j.trolleyId,j.fault,j.reportedBy,vendorName(j.vendorId)].join(' ').toLowerCase();
      if(!hay.includes(filters.q.toLowerCase())) return false;
    }
    return true;
  }).sort((a,b)=>STATUSES.indexOf(a.status)-STATUSES.indexOf(b.status) || String(b.dateReported||'').localeCompare(String(a.dateReported||'')));
}

function jobsView(){

function unitCard(t,down){
  const st = unitStatus(t,down);
  const col = trolleyColor(t);
  const pill = st==='ok'?'<span class="pill ok"><i></i>Ready</span>'
             : st==='repair'?'<span class="pill" data-s="Quoted"><i></i>Under repair</span>'
             : st==='down'?'<span class="pill down"><i></i>Not usable</span>'
             : '<span class="pill">Retired</span>';
  const n = state.jobs.filter(j=>j.trolleyId===t.id).length;
  const tint = /^#[0-9a-fA-F]{6}$/.test(col||'') ? col : '#98A2B3';
  return '<div class="unit" data-st="'+st+'"'+(col?' style="border-top:4px solid '+esc(col)+'"':'')+'>' +
    '<div class="unithead">' +
      '<button class="unitlink" data-act="trolley-log" data-id="'+esc(t.id)+'">'+esc(t.id)+'</button>' +
      '<span class="sizebadge" style="border-color:'+esc(tint)+'80;background:'+esc(tint)+'14">' +
        '<i style="background:'+esc(t.size?tint:'#E4E7EC')+'"></i>'+esc(t.size||'No size')+'</span>' +
    '</div>' +
    '<div style="margin-top:10px">'+pill+'</div>' +
    '<div class="nt">'+(t.notes?esc(t.notes):n+' repair'+(n===1?'':'s')+' on record')+'</div>' +
    '<div class="acts"><button class="btn ghost small" data-act="edit-trolley" data-id="'+esc(t.id)+'">Edit</button>' +
    (t.active?'<button class="btn ghost small" data-act="quick-repair" data-id="'+esc(t.id)+'">Log repair</button>':'')+'</div></div>';

    const dt=new Date(j.completedAt);

      '<small>Leave blank to record the date only.</small></label>' +
  '</div><p class="hint">Use this if the trolley came back earlier than when you keyed it in.</p></div>' +
  '<div class="modal-foot"><button class="btn ghost" data-act="close">Cancel</button>' +
  '<button class="btn" id="csave">Save</button></div>');

  $('#csave').addEventListener('click',()=>{

function sizesForm(){
  let rows = state.sizes.map(s=>({ name:s.name, color:s.color, orig:s.name, origColor:s.color }));
  openModal(
  '<div class="modal-head"><div><h3>Trolley sizes</h3>' +
    '<p>Each size carries a default colour. Add as many as you need.</p></div>' +
  '<button class="x" data-act="close" aria-label="Close">&times;</button></div>' +
  '<div class="modal-body"><div id="sizerows"></div>' +
  '<button type="button" class="btn ghost small" id="addsize">Add another size</button>' +
  '<p class="hint" style="margin-top:14px">Changing a colour here updates every trolley of that size that still uses the default.</p></div>' +
  '<div class="modal-foot"><button class="btn ghost" data-act="close">Cancel</button>' +
  '<button class="btn" id="savesizes">Save sizes</button></div>');

  function draw(){
    $('#sizerows').innerHTML = rows.length
      ? rows.map((s,i)=>'<div class="sizerow">' +
          '<input data-i="'+i+'" data-k="name" value="'+esc(s.name)+'" placeholder="e.g. 4 Layer">' +
          '<input type="color" data-i="'+i+'" data-k="color" value="'+esc(s.color||'#667085')+'">' +
          '<button type="button" class="btn danger small" data-rm="'+i+'">Remove</button></div>').join('')
      : '<p class="hint" style="margin-bottom:14px">No sizes yet.</p>';
  }
  draw();
  $('#sizerows').addEventListener('input', e=>{
    const i=e.target.dataset.i; if(i==null) return;
    rows[i][e.target.dataset.k] = e.target.value;
  });
  $('#sizerows').addEventListener('click', e=>{
    const b=e.target.closest('[data-rm]'); if(!b) return;
    const i=+b.dataset.rm;
    const used = state.trolleys.filter(t=>t.size===rows[i].orig).length;
    if(used){ toast(rows[i].name+' is used by '+used+' trolley'+(used===1?'':'s')+'. Change those first.'); return; }
    rows.splice(i,1); draw();
  });
  $('#addsize').addEventListener('click', ()=>{ rows.push({name:'',color:'#667085'}); draw(); });
  $('#savesizes').addEventListener('click', ()=>{
    const clean = rows.filter(r=>String(r.name||'').trim());
    const names = clean.map(r=>r.name.trim().toLowerCase());
    if(names.some((n,i)=>names.indexOf(n)!==i)){ toast('Two sizes have the same name.'); return; }
    rows.forEach(r=>{
      if(!r.orig) return;
      state.trolleys.forEach(t=>{
        if(t.size!==r.orig) return;
        if(!t.color || t.color===r.origColor) t.color = r.color;
        t.size = String(r.name||'').trim();
      });
    });
    state.sizes = clean.map(r=>({ name:r.name.trim(), color:r.color }));
    save(); closeModal(); render(); toast('Sizes updated.');
  });
}

/* ---------- summary chart ---------- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let sumYear = String(new Date().getFullYear());

function summaryView(){
  const years = [...new Set(state.jobs.filter(j=>j.receipt && j.receipt.date).map(j=>String(j.receipt.date).slice(0,4)))];
  const thisYear = String(new Date().getFullYear());
  if(!years.includes(thisYear)) years.push(thisYear);
  years.sort().reverse();
  if(!years.includes(sumYear)) sumYear = years[0];

  const paid = state.jobs.filter(j=>j.receipt && String(j.receipt.date||'').slice(0,4)===sumYear);
  const grid = {}, counts = {};
  paid.forEach(j=>{
    const m = parseInt(String(j.receipt.date).slice(5,7),10) - 1;
    if(m<0 || m>11) return;
    if(!grid[j.trolleyId]){ grid[j.trolleyId]=new Array(12).fill(0); counts[j.trolleyId]=0; }
    grid[j.trolleyId][m] += Number(j.receipt.total)||0;
    counts[j.trolleyId] += 1;
  });
  const ids = Object.keys(grid).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const monthTotal = new Array(12).fill(0);
  ids.forEach(id=>grid[id].forEach((v,i)=>monthTotal[i]+=v));
  const grand = monthTotal.reduce((a,b)=>a+b,0);
  const peak = Math.max(...monthTotal);
  const rowTotal = id => grid[id].reduce((a,b)=>a+b,0);
  const dearest = ids.slice().sort((a,b)=>rowTotal(b)-rowTotal(a))[0];

  const picker = '<div class="row"><button class="btn ghost small" data-act="pdf-summary">Save as PDF</button>' +
    '<div class="yearpick"><select id="s-year">' +
    years.map(y=>'<option value="'+esc(y)+'"'+(y===sumYear?' selected':'')+'>'+esc(y)+'</option>').join('') + '</select></div></div>';

  const head = '<div class="sec-head"><div><h2>Summary</h2>' +
    '<p class="sub">Repair cost by trolley and month, based on receipts filed</p></div>'+picker+'</div>';

  if(!paid.length){
    return head + '<div class="empty">'+glyph('doc')+'<h3>No costs recorded for '+esc(sumYear)+'</h3>' +

        '<div class="mon">'+MONTHS[i]+'</div>' +
      '</div>').join('') + '</div></section>';

  const table = '<div class="tbl-wrap matrix"><table><thead><tr><th>Trolley</th>' +
    MONTHS.map(m=>'<th class="num">'+m+'</th>').join('') + '<th class="num">Total</th></tr></thead><tbody>' +

async function loadPhoto(jid){

  await DB.putPhotos(jid,[obj]);           // replaces whatever was stored for this repair
}
async function dropPhoto(jid){ try{ await DB.dropPhotos(jid); }catch(e){} }
function readFile(file){
  return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=()=>rej(new Error('read failed')); fr.readAsDataURL(file); });
}
async function prepFile(file){
  const raw = await readFile(file);
  if(!file.type.startsWith('image/')) return { name:file.name, type:file.type, data:raw };
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error('bad image')); i.src=raw; });
  const MAXPX=1500;
  let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  if(Math.max(w,h)>MAXPX){ const s=MAXPX/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  c.getContext('2d').drawImage(img,0,0,w,h);
  return { name:file.name||'receipt.jpg', type:'image/jpeg', data:c.toDataURL('image/jpeg',0.75) };
}

  function drawDrop(photo,note){
    const el=$('#r-drop'); if(!el) return;
    if(!photo){ el.innerHTML = glyph('camera')+'<p>'+(note||'Snap the receipt with your camera, or pick a photo or PDF from this device.')+'</p>'+buttons; return; }
    const preview = photo.type && photo.type.startsWith('image/')
      ? '<img src="'+photo.data+'" alt="Receipt">' : glyph('doc');
    el.innerHTML = preview + '<div class="fname">'+esc(photo.name||'receipt')+(note?' — '+esc(note):'')+'</div>' +
      '<div class="row"><label class="aslabel" for="r-up">Replace</label><button type="button" class="btn danger small" id="r-clear">Remove</button></div>';
    $('#r-clear').addEventListener('click',()=>{ pendingFile=null; shownPhoto=null; drawDrop(null,'Removed. Save to confirm.'); });
  }
  drawDrop(null,'Checking for a stored copy…');
  loadPhoto(id).then(p=>{ if($('#r-drop') && pendingFile===undefined){ shownPhoto=p; drawDrop(p); } });

  async function pick(e){
    const file=e.target.files && e.target.files[0]; e.target.value='';
    if(!file) return;
    drawDrop(null,'Preparing…');
    try{ pendingFile=await prepFile(file); drawDrop(pendingFile,'not saved yet'); }
    catch(err){ pendingFile=undefined; drawDrop(shownPhoto,'That file could not be read. Try another.'); }
  }
  $('#r-cam').addEventListener('change',pick);
  $('#r-up').addEventListener('change',pick);
}

async function saveReceipt(id){
  const f=$('#rform'); if(!f.reportValidity()) return;
  const sb=document.querySelector('#modal [data-act="save-receipt"]');
  if(sb){ if(sb.disabled) return; sb.disabled=true; sb.textContent='Saving…'; }
  const fd=Object.fromEntries(new FormData(f).entries());
  const pct = Math.max(0, Number(fd.pct)||0);
  fd.net = Number(fd.net)||0;
  fd.pct = pct;
  fd.gst = +(fd.net*pct/100).toFixed(2);
  fd.total = +(fd.net + fd.gst).toFixed(2);
  state.gstRate = pct/100;                       // becomes the default for the next receipt
  const j=state.jobs.find(x=>x.id===id);
  const prev = j.receipt ? j.receipt.file : null;
  fd.file = prev || null;
  let note='';
  if(pendingFile===null){ await dropPhoto(id); fd.file=null; }
  else if(pendingFile){
    toast('Uploading the picture to Drive…');
    try{ await savePhoto(id,pendingFile); fd.file={name:pendingFile.name,type:pendingFile.type}; }
    catch(err){ fd.file=prev||null; note=' The image could not be stored — details saved without it.'; }
  }
  j.receipt=fd; j.updated=new Date().toISOString();
  if(j.status!=='Completed' && j.status!=='Cancelled'){
    j.status='Completed';
    if(!j.completedAt) j.completedAt = new Date().toISOString();
    if(!j.dateCompleted) j.dateCompleted = fd.date || today();
  }
  save(); closeModal(); render();
  toast('Receipt saved. '+j.trolleyId+' is back in service.'+note);
}

async function viewFile(id){
  const j=state.jobs.find(x=>x.id===id);

}

/* ============================================================ PDF */
function pdfDoc(landscape){
  if(!window.jspdf){ toast('PDF library did not load. Check your connection and refresh.'); return null; }
  return new window.jspdf.jsPDF({unit:'pt',format:'a4',orientation:landscape?'landscape':'portrait'});
}
const M=48, PW=595, RW=PW-M*2;
const BRAND=[14,76,102];
const pgW = doc => doc.internal.pageSize.getWidth();
const pgH = doc => doc.internal.pageSize.getHeight();
function pdfHeader(doc,docType,ref,vendor){
  const W = pgW(doc);
  doc.setFillColor(BRAND[0],BRAND[1],BRAND[2]); doc.rect(0,0,W,96,'F');
  doc.setTextColor(255,255,255).setFont('helvetica','bold').setFontSize(22); doc.text('MMRC',M,38);
  doc.setFontSize(12); doc.text('OPS SUPPORT',M,57);
  doc.setFont('helvetica','normal').setFontSize(9.5).setTextColor(184,212,222); doc.text('Trolley fleet maintenance',M,74);
  if(vendor){
    doc.setFont('helvetica','bold').setFontSize(11.5).setTextColor(255,255,255);
    doc.text(doc.splitTextToSize(String(vendor),225), W-M, 38, {align:'right'});
  }
  const y = 126;
  doc.setFont('helvetica','bold').setFontSize(8.5).setTextColor(102,112,133);
  doc.text(String(docType).toUpperCase(), M, y);
  if(ref){ doc.setFont('helvetica','normal'); doc.text(String(ref), W-M, y, {align:'right'}); }
  doc.setDrawColor(228,231,236).setLineWidth(.8); doc.line(M,y+9,W-M,y+9);
  doc.setTextColor(16,24,40);
  return y + 32;
}
function vendorLabelFor(rows){
  if(filters.vendor) return vendorName(filters.vendor);
  const ids=[...new Set(rows.map(j=>j.vendorId).filter(Boolean))];
  if(ids.length===1 && rows.every(j=>j.vendorId)) return vendorName(ids[0]);
  return ids.length ? 'All vendors' : '';
}
function pdfLabel(doc,t,x,y){ doc.setFont('helvetica','bold').setFontSize(7.5).setTextColor(102,112,133); doc.text(String(t).toUpperCase(),x,y); }
function pdfValue(doc,t,x,y,size){ doc.setFont('helvetica','normal').setFontSize(size||11).setTextColor(16,24,40); doc.text(String(t||'—'),x,y); }
function pdfSection(doc,t,y){
  const W = pgW(doc);
  doc.setFillColor(244,246,249); doc.rect(M,y-12,W-M*2,20,'F');
  doc.setFont('helvetica','bold').setFontSize(8.5).setTextColor(16,24,40); doc.text(String(t).toUpperCase(),M+9,y+2);
  return y+32;
}
function pdfFooter(doc){
  const n=doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i); doc.setFont('helvetica','normal').setFontSize(7.5).setTextColor(152,162,179);
    doc.text('Generated '+fdate(today())+'   ·   page '+i+' of '+n, M, pgH(doc)-30);
  }
}
function pdfOut(doc,name){
  try{ doc.save(name); toast('PDF saved as '+name); }
  catch(e){
    try{ window.open(doc.output('bloburl'),'_blank'); toast('PDF opened in a new tab — save it from there.'); }
    catch(e2){ toast('Could not create the PDF here. Open this page in your browser and try again.'); }
  }
}

function sheetPage(doc,j,photo){

  doc.setFont('helvetica','bold').setFontSize(26).setTextColor(16,24,40); doc.text(j.trolleyId,M+16,y+22);
  if(tro && tro.size){

  }
  doc.setFont('helvetica','normal').setFontSize(10).setTextColor(16,24,40);
  doc.text('Status: '+j.status, PW-M-16, y+10, {align:'right'});
  if(j.usable==='no'){ doc.setFont('helvetica','bold').setTextColor(180,35,24); doc.text('OUT OF SERVICE', PW-M-16, y+30, {align:'right'}); }
  else { doc.setTextColor(6,118,71); doc.text('Still usable', PW-M-16, y+30, {align:'right'}); }
  doc.setTextColor(16,24,40);
  y += 80;

  y = pdfSection(doc,'Request details',y);
  const c3 = M + RW/3, c3b = M + (RW/3)*2;
  pdfLabel(doc,'Date reported',M,y);  pdfValue(doc,fdate(j.dateReported),M,y+15);
  pdfLabel(doc,'Reported by',c3,y);   pdfValue(doc,j.reportedBy,c3,y+15);
  pdfLabel(doc,'Priority',c3b,y);     pdfValue(doc,j.priority,c3b,y+15);
  y += 46;

  doc.setFont('helvetica','normal').setFontSize(11);
  const lines=doc.splitTextToSize(j.fault||'—',RW-24);

  y = pdfSection(doc,'Assigned vendor',y);

    pdfValue(doc,v.name,M,y,13);

    doc.setTextColor(16,24,40).setFontSize(10);
    doc.text([v.contact,v.phone,v.email].filter(Boolean).join('   ·   ')||'—',M,y+31);

    if(reg){ doc.setTextColor(102,112,133).setFontSize(9.5); doc.text(reg,M,vy); vy += 14; doc.setTextColor(16,24,40); }
    y = vy + 6;
  }else{ pdfValue(doc,'Not assigned yet',M,y); y += 28; }

  if(r){
    y = pdfSection(doc,'Receipt on file',y);
    pdfLabel(doc,'Invoice no.',M,y); pdfValue(doc,r.invoiceNo,M,y+15);
    pdfLabel(doc,'Invoice date',col2,y); pdfValue(doc,fdate(r.date),col2,y+15);
    y += 40;
    pdfLabel(doc,'Trolley returned',M,y); pdfValue(doc, fdate(j.dateCompleted)+(j.completedAt?'  '+ftime(j.completedAt):''), M,y+15);
    pdfLabel(doc,'Copy of receipt',col2,y); pdfValue(doc, r.file?(photo?'Attached overleaf':'Attached'):'Not captured',col2,y+15);
    y += 44;
    doc.setFillColor(BRAND[0],BRAND[1],BRAND[2]); doc.roundedRect(M,y,RW,50,4,4,'F');
    doc.setTextColor(184,212,222).setFont('helvetica','bold').setFontSize(8);
    doc.text('BEFORE GST',M+16,y+20); doc.text('GST',M+156,y+20); doc.text('TOTAL PAYABLE',PW-M-16,y+20,{align:'right'});
    doc.setTextColor(255,255,255).setFontSize(13);
    doc.text(sgd(r.net),M+16,y+38); doc.text(sgd(r.gst),M+156,y+38);
    doc.setFontSize(17); doc.text(sgd(r.total),PW-M-16,y+38,{align:'right'});
    y += 72; doc.setTextColor(16,24,40);
  }
}

async function jobPDF(id){
  const j=state.jobs.find(x=>x.id===id); const doc=pdfDoc(); if(!doc) return;
  const r=j.receipt;
  const photo = (r && r.file) ? await loadPhoto(id) : null;
  sheetPage(doc,j,photo);

    doc.addPage();
    const py=pdfHeader(doc,'RECEIPT', j.trolleyId+'  ·  '+(r.invoiceNo||''), vendorName(j.vendorId));
    try{
      const props=doc.getImageProperties(photo.data);
      const maxH=770-py;
      let w=RW, h=props.height*(RW/props.width);

      doc.addImage(photo.data,'JPEG',M+(RW-w)/2,py,w,h);
    }catch(err){ pdfValue(doc,'The stored image could not be placed in this PDF.',M,py); }
  }

function summaryPDF(){
  const doc=pdfDoc(true); if(!doc) return;
  const W=pgW(doc), RWL=W-M*2;
  const paid = state.jobs.filter(j=>j.receipt && String(j.receipt.date||'').slice(0,4)===sumYear);
  if(!paid.length){ toast('No costs recorded for '+sumYear+' yet.'); return; }

  const grid={}, counts={};
  paid.forEach(j=>{
    const m=parseInt(String(j.receipt.date).slice(5,7),10)-1;
    if(m<0||m>11) return;
    if(!grid[j.trolleyId]){ grid[j.trolleyId]=new Array(12).fill(0); counts[j.trolleyId]=0; }
    grid[j.trolleyId][m]+=Number(j.receipt.total)||0; counts[j.trolleyId]+=1;
  });
  const ids=Object.keys(grid).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const monthTotal=new Array(12).fill(0);
  ids.forEach(id=>grid[id].forEach((v,i)=>monthTotal[i]+=v));
  const grand=monthTotal.reduce((a,b)=>a+b,0);
  const peak=Math.max(...monthTotal);
  const rowTotal=id=>grid[id].reduce((a,b)=>a+b,0);
  const dearest=ids.slice().sort((a,b)=>rowTotal(b)-rowTotal(a))[0];

  // ---- page 1: figures + chart
  let y=pdfHeader(doc,'ANNUAL SUMMARY', sgd(grand)+' total', sumYear);
  const box=(label,val,note,x,w)=>{
    doc.setDrawColor(228,231,236).setLineWidth(.8); doc.roundedRect(x,y-6,w,66,4,4);
    doc.setFont('helvetica','bold').setFontSize(7.5).setTextColor(102,112,133); doc.text(label.toUpperCase(),x+14,y+14);
    doc.setFont('helvetica','bold').setFontSize(17).setTextColor(16,24,40); doc.text(String(val),x+14,y+38);
    if(note){ doc.setFont('helvetica','normal').setFontSize(8.5).setTextColor(102,112,133); doc.text(note,x+14,y+52); }

  box('Total spend '+sumYear, sgd(grand), paid.length+' repair'+(paid.length===1?'':'s')+' invoiced', M, bw);
  box('Trolleys repaired', String(ids.length), 'of '+state.trolleys.length+' in the fleet', M+bw+12, bw);
  box('Costliest trolley', dearest||'—', dearest?sgd(rowTotal(dearest))+' across '+counts[dearest]+' repair'+(counts[dearest]===1?'':'s'):'', M+(bw+12)*2, bw);
  y += 92;

  y = pdfSection(doc,'Monthly spend',y);
  const chartH=170, base=y+chartH, slot=RWL/12;
  doc.setDrawColor(228,231,236).setLineWidth(.7); doc.line(M,base,W-M,base);
  monthTotal.forEach((v,i)=>{
    const cx=M+slot*i, bwid=slot*0.52, bx=cx+(slot-bwid)/2;
    const h = peak ? Math.max((v/peak)*(chartH-24), v?3:0) : 0;

      doc.setFillColor(v===peak?10:14, v===peak?58:76, v===peak?78:102);

  // ---- page 2+: matrix

    doc.setFillColor(244,246,249); doc.rect(M,ty-13,RWL,20,'F');

    ly += 22;
  };
  logHead();
  if(!log.length){
    doc.setFont('helvetica','normal').setFontSize(9.5).setTextColor(102,112,133);
    doc.text('No repairs recorded in '+sumYear+'.',M,ly+4);

  log.forEach(j=>{

}

  let y=pdfHeader(doc,'RECEIPTS SUMMARY',rows.length+' receipts', vlabel);
  const cols=[M,M+100,M+166,M+256];
  doc.setFillColor(244,246,249); doc.rect(M,y-13,RW,20,'F');
  ['Invoice no.','Date','Trolley','Vendor'].forEach((h,i)=>pdfLabel(doc,h,cols[i],y));
  pdfLabel(doc,'Total',PW-M-26,y);
  y += 22;
  let sum=0;
  rows.forEach(j=>{
    const r=j.receipt; sum += Number(r.total)||0;
    if(y>760){ doc.addPage(); y=pdfHeader(doc,'RECEIPTS SUMMARY','continued',vlabel); }
    doc.setFont('helvetica','normal').setFontSize(9.5).setTextColor(52,64,84);
    doc.text(String(r.invoiceNo||'—'),cols[0],y+4);
    doc.text(fdate(r.date),cols[1],y+4);
    doc.setFont('helvetica','bold').setTextColor(16,24,40); doc.text(j.trolleyId,cols[2],y+4);
    doc.setFont('helvetica','normal').setTextColor(52,64,84); doc.text(String(vendorName(j.vendorId)||'—').slice(0,24),cols[3],y+4);
    doc.text(sgd(r.total),PW-M,y+4,{align:'right'});
    doc.setDrawColor(240,242,245).setLineWidth(.6); doc.line(M,y+10,PW-M,y+10);
    y += 24;
  });
  doc.setFillColor(BRAND[0],BRAND[1],BRAND[2]); doc.roundedRect(M,y,RW,36,4,4,'F');
  doc.setTextColor(184,212,222).setFont('helvetica','bold').setFontSize(8); doc.text('TOTAL',M+16,y+22);
  doc.setTextColor(255,255,255).setFontSize(14); doc.text(sgd(sum),PW-M-16,y+23,{align:'right'});
  pdfFooter(doc);
  pdfOut(doc,'Trolley-receipts-'+today()+'.pdf');
}

/* ============================================================ events */
document.addEventListener('click', e=>{
  const tab=e.target.closest('.tab');
  if(tab){ view=tab.dataset.view; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const id=btn.dataset.id;
  switch(btn.dataset.act){
    case 'close': closeModal(); break;
    case 'new-job': jobForm(); break;
    case 'quick-repair': jobForm(null,id); break;
    case 'edit-job': jobForm(id); break;
    case 'save-job': saveJob(id); break;
    case 'complete-job': {
      const j = state.jobs.find(x=>x.id===id);
      if(!confirm('Confirm '+j.trolleyId+' has completed its repair?\n\nThe trolley goes back into service and the date and time are stamped now.')) break;
      const now = new Date();
      j.status='Completed';
      j.completedAt = now.toISOString();
      j.dateCompleted = now.toISOString().slice(0,10);
      j.updated = now.toISOString();
      save(); render();
      toast(j.trolleyId+' completed at '+ftime(j.completedAt)+' on '+fdate(j.dateCompleted)+'.');
      break;
    }
    case 'del-job':
      if(confirm('Delete this repair and its receipt?')){ dropPhoto(id); state.jobs=state.jobs.filter(j=>j.id!==id); save(); render(); toast('Repair deleted.'); }
      break;
    case 'new-trolley': trolleyForm(); break;
    case 'sizes': sizesForm(); break;
    case 'trolley-log': trolleyLog(id); break;
    case 'edit-completion': completionForm(id); break;
    case 'pdf-summary': summaryPDF(); break;
    case 'edit-trolley': trolleyForm(id); break;
    case 'save-trolley': saveTrolley(id); break;
    case 'del-trolley': deleteTrolley(id); break;
    case 'reset-fleet': seedFleet(); save(); render(); toast('TR-01 to TR-23 restored.'); break;
    case 'new-vendor': vendorForm(); break;
    case 'edit-vendor': vendorForm(id); break;
    case 'save-vendor': saveVendor(id); break;
    case 'del-vendor': deleteVendor(id); break;
    case 'receipt': receiptForm(id); break;
    case 'save-receipt': saveReceipt(id); break;
    case 'del-receipt':
      if(confirm('Remove the receipt and its stored copy?')){
        dropPhoto(id); state.jobs.find(j=>j.id===id).receipt=null; save(); closeModal(); render(); toast('Receipt removed.');
      }
      break;
    case 'view-file': viewFile(id); break;
    case 'pdf-job': jobPDF(id); break;
    case 'pdf-list': listPDF(); break;
    case 'pdf-receipts': receiptsPDF(); break;
    case 'clear-filters': filters={q:'',status:'',vendor:'',trolley:''}; render(); break;
    case 'clear-history': hFilter={q:'',trolley:'',noReceipt:false}; render(); break;
    case 'go-outstanding':
      hFilter={q:'',trolley:'',noReceipt:true}; view='history'; render();
      window.scrollTo({top:0,behavior:'smooth'});
      break;
    case 'go-summary': view='summary'; render(); window.scrollTo({top:0,behavior:'smooth'}); break;
    case 'go-jobs': view='jobs'; render(); break;
    case 'go-history': view='history'; render(); break;
    case 'go-receipts': view='receipts'; render(); break;
    case 'reopen-job': {
      const j = state.jobs.find(x=>x.id===id);
      j.status='In progress'; j.dateCompleted=''; j.completedAt=''; j.updated=new Date().toISOString();
      save(); render(); toast(j.trolleyId+' reopened and back on the Repairs tab.');
      break;
    }
    case 'filter-trolley':
      filters={q:'',status:'',vendor:'',trolley:''};
      if(state.jobs.some(j=>j.trolleyId===id)){ filters.trolley=id; view='jobs'; render(); }
      else jobForm(null,id);
      break;
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='f-q'){ filters.q=e.target.value; const p=e.target.selectionStart; render(); const n=$('#f-q'); if(n){n.focus();n.setSelectionRange(p,p);} }
  if(e.target.id==='h-q'){ hFilter.q=e.target.value; const p=e.target.selectionStart; render(); const n=$('#h-q'); if(n){n.focus();n.setSelectionRange(p,p);} }
});
document.addEventListener('change', e=>{
  if(e.target.id==='f-status'){ filters.status=e.target.value; render(); }
  if(e.target.id==='f-vendor'){ filters.vendor=e.target.value; render(); }
  if(e.target.id==='f-trolley'){ filters.trolley=e.target.value; render(); }
  if(e.target.id==='h-trolley'){ hFilter.trolley=e.target.value; render(); }
  if(e.target.id==='s-year'){ sumYear=e.target.value; render(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#scrim').classList.contains('open')) closeModal(); });
$('#scrim').addEventListener('mousedown', e=>{ if(e.target.id==='scrim') closeModal(); });


/* ============================================================ start-up */
async function boot(){
  if(!Store.ready()){ location.href='index.html#setup'; return; }
  flag('Loading','warn');
  $('#view').innerHTML = '<div class="empty">'+glyph('doc')+'<h3>Loading from Google…</h3>' +
    '<p>Fetching the latest records. This takes a few seconds.</p></div>';
  try{ await loadData(); }
  catch(err){ bootFailed(err); return; }
  booted = true;
  save(); render();
}
function bootFailed(err){
  canSave = false; flag('Not connected','warn');
  if(err && (err.code==='setup' || err.code==='passcode')){ location.href='index.html#setup'; return; }
  document.querySelector('.tabs').style.display='none';
  $('#view').innerHTML = '<div class="empty">'+glyph('doc')+'<h3>Could not load the records</h3>' +
    '<p>'+esc((err && err.message) || 'Unknown error')+'</p>' +
    '<div class="row" style="justify-content:center"><button class="btn" onclick="location.reload()">Try again</button>' +
    '<a class="btn ghost" href="index.html#setup">Connection settings</a></div></div>';
}
boot();

</script>
